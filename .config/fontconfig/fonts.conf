<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ====== 统一字体链：拉丁 Lucida MAC + DejaVu，中文统一黑体 ====== -->
  <!-- 核心修复：消灭衬线/无衬线分流，所有非等宽中文统一 Noto Sans CJK SC -->

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Lucida MAC</family>
      <family>Noto Sans CJK SC</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Sans</family>
    <prefer>
      <family>Lucida MAC</family>
      <family>Noto Sans CJK SC</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

  <!-- ====== 中文统一回退：非等宽一律黑体，等宽用等宽黑体 ====== -->
  <!-- 通用：所有中文先统一黑体 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- 等宽再叠加：monospace 的中文等宽黑体置顶（后执行=更靠前） -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="genericfamily" compare="eq"><const>monospace</const></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- ====== 字重修复：已移除全局 bold ====== -->
  <!-- 原配置强制所有中文为 bold（weight 200），导致 Regular 命中 Bold 文件 -->
  <!-- 现保持 Regular (weight 80) 与 Lucida MAC Normal 一致，中英文重量统一 -->
  <!-- 如觉 Regular 偏细，可取消下两段注释以提升至 medium（100） -->
  <!--
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK SC</string></test>
    <test name="weight" compare="less_eq"><const>medium</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono CJK SC</string></test>
    <test name="weight" compare="less_eq"><const>medium</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  -->

  <!-- ====== 抗锯齿与微调 ====== -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- CJK 保持 hintslight，避免 hintfull 导致的笔画过粗/彩边 -->
  <match target="font">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

</fontconfig>
